name: CodeProof verification and supply-chain audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeproof-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Restore verified TypeScript compiler assets
        run: node scripts/restore-vendor.mjs
      - name: Run unit and runtime-contract tests
        run: node --test tests/*.test.mjs
      - name: Run repository static audit and verify reviewed baseline
        shell: bash
        run: |
          set +e
          node docs/integrations/cli.mjs
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node scripts/check-static-baseline.mjs
      - name: Verify SBOM and resolved licence inventory
        run: node scripts/generate-sbom.mjs --check
      - name: Audit licence evidence and pinned external runtime
        run: node scripts/audit-supply-chain.mjs
      - name: Upload static audit and inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeproof-audit-${{ github.run_id }}
          path: |
            codeproof-report.json
            sbom.cdx.json
            licenses-resolved.json
          if-no-files-found: warn
          retention-days: 30
