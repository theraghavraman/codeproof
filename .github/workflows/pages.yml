name: Deploy CodeProof to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Restore verified TypeScript compiler assets
        run: node scripts/restore-vendor.mjs
      - name: Test the codebase before publishing
        run: node --test tests/*.test.mjs
      - name: Audit runtime source and verify reviewed baseline
        shell: bash
        run: |
          set +e
          node docs/integrations/cli.mjs
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node scripts/check-static-baseline.mjs
      - name: Verify supply-chain records
        run: |
          node scripts/generate-sbom.mjs --check
          node scripts/audit-supply-chain.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
